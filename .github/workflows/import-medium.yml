name: Import Medium articles

# Copies the Medium articles into src/content/blog and commits them. It already ran once;
# start it again from the Actions tab if needed. Existing posts are never overwritten.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: node scripts/import-medium.mjs

      - name: Commit imported articles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/content/blog public/images/blog
          if git diff --cached --quiet; then
            echo "Nothing new to import."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Medium articles into the blog"
          git push
          # Pushes made with GITHUB_TOKEN don't start other workflows, so start the deploy here.
          gh workflow run deploy.yml --ref main
